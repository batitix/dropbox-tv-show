<!DOCTYPE html>
<html>
<head>
    <title>Cloudinary Image Uploader</title>
    <style>
        body { font-family: sans-serif; margin: 40px; }
        #dropArea { border: 2px dashed #888; padding: 50px; text-align: center; cursor: pointer; }
        #result { margin-top: 20px; white-space: pre-wrap; }
        .upload-item { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 12px; 
        }
        .progress-circle {
            width: 30px; height: 30px;
            border-radius: 50%;
            border: 3px solid #ccc;
            border-top: 3px solid #4CAF50;
            animation: spin 1s linear infinite;
            position: relative;
        }
        .progress-circle.done {
            animation: none;
            border-color: #4CAF50;
        }
        .progress-circle.error {
            animation: none;
            border-color: red;
        }
        .progress-circle span {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 11px;
        }
        button { margin-top: 10px; margin-right: 10px; }
        a { font-size: 13px; color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<h2>Drag & Drop Images to Cloudinary</h2>
<div id="dropArea">Drop images here or click to select</div>
<input type="file" id="fileInput" multiple style="display:none;">
<br>
<button id="copyBtn">Copy All Links (Title + URL)</button>
<button id="resetBtn">Reset</button>
<div id="result"></div>

<script src="script.js"></script>
</body>
</html>
